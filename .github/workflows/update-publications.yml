name: Update publication list

on:
  # Allows manual testing from the Actions tab
  workflow_dispatch:

  # Runs January 1, May 1, and September 1 at 9:00 AM Eastern
  schedule:
    - cron: "0 9 1 1,5,9 *"
      timezone: "America/New_York"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publications-and-pages
  cancel-in-progress: false

jobs:
  update-publications:
    name: Update publications
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate publications
        run: python update_publications.py

      - name: Validate publications JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("publications.json")

          if not path.exists():
              raise SystemExit(
                  "ERROR: publications.json was not created."
              )

          data = json.loads(
              path.read_text(encoding="utf-8")
          )

          if isinstance(data, list):
              publications = data

          elif isinstance(data, dict):
              publications = (
                  data.get("publications")
                  or data.get("items")
                  or data.get("results")
                  or []
              )

          else:
              raise SystemExit(
                  "ERROR: publications.json must contain "
                  "an object or an array."
              )

          if not isinstance(publications, list):
              raise SystemExit(
                  "ERROR: Could not locate a publication array."
              )

          if len(publications) == 0:
              raise SystemExit(
                  "ERROR: The publication list is empty. "
                  "Refusing to publish it."
              )

          print(
              f"Validated publications.json: "
              f"{len(publications)} publications"
          )
          PY

      - name: Commit updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add publications.json publication-review.json

          if git diff --cached --quiet; then
            echo "No publication changes to commit."
          else
            git commit -m "Automatically update publications"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages files
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Display deployed URL
        run: |
          echo "GitHub Pages deployed to:"
          echo "${{ steps.deployment.outputs.page_url }}"
          echo "Publication JSON:"
          echo "${{ steps.deployment.outputs.page_url }}publications.json"
